# reload tmux
unbind r
bind r source-file ~/.tmux.conf

# binding for tmux
set -g prefix C-Space

# reduce esc press time
set -sg escape-time 0

set -g xterm-keys on
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'
set -as terminal-overrides ',*:kLFT5=\e[1;5D:kRIT5=\e[1;5C:kUP5=\e[1;5A:kDN5=\e[1;5B'

# vim-like pane navigation (prefix + hjkl)
unbind h
unbind j
unbind k
unbind l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resizing (prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# pane resizing (prefix + arrow keys)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# pane resizing (Option/Alt + arrow keys)
bind-key -r -n M-Left resize-pane -L 5
bind-key -r -n M-Down resize-pane -D 5
bind-key -r -n M-Up resize-pane -U 5
bind-key -r -n M-Right resize-pane -R 5

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
unbind-key -n WheelUpPane
unbind-key -n WheelDownPane
bind-key -n WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F \"#{alternate_on}\" \"send-keys -M\" \"copy-mode -e; send-keys -M\""
bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F \"#{alternate_on}\" \"send-keys -M\" \"\""

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

bind C-l send-keys C-l

set -g mouse on
setw -g mode-keys vi

# change status position
set-option -g status-position top
set -g status-left-length 50
set -g status-left "[#S:#I] "

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"
# Split panes in the current directory
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Tokyo night plugin
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @theme_variation 'night'
set -g @theme_plugins 'datetime,cpu,memory,nowplaying,git'

# vim navigation in tmux
set -g @plugin 'christoomey/vim-tmux-navigator'

# copy from wsl
set -g @plugin 'tmux-plugins/tmux-yank'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Tell tmux to support 24-bit color
set -ag terminal-overrides ",xterm-256color:RGB"

# You might also need this default
set -g default-terminal "tmux-256color"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
