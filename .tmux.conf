# reload tmux
unbind r
bind r source-file ~/.tmux.conf

# binding for tmux
set -g prefix C-Space
set -g prefix2 C-a
bind-key -T root C-Space switch-client -T prefix
bind-key -T prefix z resize-pane -Z

# reduce esc press time
set -sg escape-time 0

set -g xterm-keys on
# Pass distinct Ctrl/Shift combinations through to Neovim.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-overrides ',*:kLFT5=\e[1;5D:kRIT5=\e[1;5C:kUP5=\e[1;5A:kDN5=\e[1;5B'

# vim-like pane navigation (prefix + jkl; prefix + h is a split, use C-h to go left)
unbind j
unbind k
unbind l
bind j select-pane -Z -D
bind k select-pane -Z -U
bind l select-pane -Z -R

# pane resizing (prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# pane resizing (prefix + arrow keys)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# pane resizing (Option/Alt + arrow keys)
bind-key -r -n M-Left resize-pane -L 5
bind-key -r -n M-Down resize-pane -D 5
bind-key -r -n M-Up resize-pane -U 5
bind-key -r -n M-Right resize-pane -R 5

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -Z -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -Z -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -Z -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -Z -R'
unbind-key -n WheelUpPane
unbind-key -n WheelDownPane
bind-key -n WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F \"#{alternate_on}\" \"send-keys -M\" \"copy-mode -e; send-keys -M\""
bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F \"#{alternate_on}\" \"send-keys -M\" \"\""

bind-key -T copy-mode-vi 'C-h' select-pane -Z -L
bind-key -T copy-mode-vi 'C-j' select-pane -Z -D
bind-key -T copy-mode-vi 'C-k' select-pane -Z -U
bind-key -T copy-mode-vi 'C-l' select-pane -Z -R

bind C-l send-keys C-l

set -g mouse on
setw -g mode-keys vi
set -g allow-rename off
setw -g automatic-rename off

# change status position
set-option -g status-position top
set -g status-left-length 50
set -g status-left "[#S:#I] "

# Prefer zsh when available; otherwise fall back to interactive bash.
if-shell '[ -x /bin/zsh ]' 'set -g default-shell /bin/zsh; set -g default-command "exec /bin/zsh -i"' 'set -g default-shell /bin/bash; set -g default-command "exec /bin/bash -i"'

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"
# Split panes in the current directory
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Black background inside tmux
set -g window-style "bg=#000000"
set -g window-active-style "bg=#000000"

# Moonfly colours for the Catppuccin status bar (must be set before the plugin loads)
set -g @thm_bg "#000000"
set -g @thm_fg "#c6c6c6"
set -g @thm_rosewater "#e4e4e4"
set -g @thm_flamingo "#ff5189"
set -g @thm_pink "#cf87e8"
set -g @thm_mauve "#cf87e8"
set -g @thm_red "#ff5454"
set -g @thm_maroon "#ff5189"
set -g @thm_peach "#de935f"
set -g @thm_yellow "#e3c78a"
set -g @thm_green "#8cc85f"
set -g @thm_teal "#79dac8"
set -g @thm_sky "#74b2ff"
set -g @thm_sapphire "#74b2ff"
set -g @thm_blue "#80a0ff"
set -g @thm_lavender "#ae81ff"
set -g @thm_subtext_1 "#bdbdbd"
set -g @thm_subtext_0 "#b2b2b2"
set -g @thm_overlay_2 "#949494"
set -g @thm_overlay_1 "#808080"
set -g @thm_overlay_0 "#626262"
set -g @thm_surface_2 "#4e4e4e"
set -g @thm_surface_1 "#303030"
set -g @thm_surface_0 "#1c1c1c"
set -g @thm_mantle "#000000"
set -g @thm_crust "#080808"
set -g @catppuccin_status_background "#000000"

# Catppuccin tmux theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-right-length 150
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'



# vim navigation in tmux
set -g @plugin 'christoomey/vim-tmux-navigator'

# copy from wsl
set -g @plugin 'tmux-plugins/tmux-yank'
# wl-copy steals focus on KWin (see nvim options.lua), so use xclip on Linux.
# macOS is left alone: tmux-yank finds pbcopy by itself.
if-shell '[ "$(uname)" = Linux ] && command -v xclip >/dev/null' "set -g @override_copy_command 'xclip -quiet -i -selection clipboard'"
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Tell tmux to support 24-bit color
set -ag terminal-overrides ",xterm-256color:RGB"

# You might also need this default
set -g default-terminal "tmux-256color"

# Ghostty features tmux should use
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle:sync:clipboard:extkeys:focus"
set -g set-clipboard on
set -g focus-events on

bind-key -T copy-mode-vi v send-keys -X begin-selection
# Copy through the terminal clipboard (tmux-yank overrides y when it loads)
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
